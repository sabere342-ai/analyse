[project]
name = "madrid-retail-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "weasyprint==70.0",
  "python-multipart==0.0.32",
  "cryptography==50.0.2",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2", "mypy==2.4.0", "reportlab==5.1.0", "xlwt==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
files = ["madrid"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madrid"]
